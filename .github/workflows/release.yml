name: Release

# Packs the extension into a versioned zip and attaches it to a GitHub
# release. Triggered by version tags (v*) and pushes to main; skips quietly
# if a release for the manifest version already exists. The release (and its
# tag, when run from a branch push) is created with the gh CLI.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Run tests before releasing
        run: npm test

      - name: Derive version from manifest
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists — nothing to do."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension zip
        if: steps.check.outputs.release_exists == 'false'
        run: |
          NAME=medicus-rota-manager-v${{ steps.version.outputs.version }}
          mkdir -p "_build/$NAME"
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='_build/' \
            --exclude='docs/' \
            --exclude='scripts/' \
            --exclude='test-*.js' \
            --exclude='package.json' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='.claude/' \
            --exclude='*.zip' \
            --exclude='.DS_Store' \
            ./ "_build/$NAME/"
          cd _build
          zip -r "../$NAME.zip" "$NAME/"

      - name: Create GitHub release
        if: steps.check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cat > release-notes.md <<EOF
          Medicus Rota Manager v$VERSION.

          Download \`medicus-rota-manager-v$VERSION.zip\` below, unzip it, then
          Chrome → \`chrome://extensions\` → enable Developer mode →
          **Load unpacked** → select the unzipped folder.

          Changes: see [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md).
          EOF
          gh release create "v$VERSION" "medicus-rota-manager-v$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Medicus Rota Manager v$VERSION" \
            --notes-file release-notes.md
