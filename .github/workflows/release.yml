name: Release

# Packs the extension into a versioned zip and attaches it to a GitHub
# release. Triggered by version tags (v*) and pushes to main; skips quietly
# if a release for the manifest version already exists. The release (and its
# tag, when run from a branch push) is created with the gh CLI.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Run tests before releasing
        run: npm test

      - name: Derive version from manifest
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v${{ steps.version.outputs.version }}")
          echo "Existence check returned HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists — nothing to do."
          elif [ "$STATUS" = "404" ]; then
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected HTTP $STATUS checking for existing release — token problem?"
            exit 1
          fi

      - name: Build extension zip
        if: steps.check.outputs.release_exists == 'false'
        run: |
          NAME=medicus-rota-manager-v${{ steps.version.outputs.version }}
          mkdir -p "_build/$NAME"
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='_build/' \
            --exclude='docs/' \
            --exclude='scripts/' \
            --exclude='test-*.js' \
            --exclude='package.json' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='.claude/' \
            --exclude='*.zip' \
            --exclude='.DS_Store' \
            ./ "_build/$NAME/"
          cd _build
          zip -r "../$NAME.zip" "$NAME/"

      - name: Create GitHub release
        if: steps.check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH="Authorization: Bearer $GH_TOKEN"

          BODY=$(node -e '
            const v = process.argv[1];
            const repo = process.env.GITHUB_REPOSITORY;
            const notes = [
              `Medicus Rota Manager v${v}.`,
              ``,
              `Download \`medicus-rota-manager-v${v}.zip\` below, unzip it, then`,
              `Chrome → \`chrome://extensions\` → enable Developer mode →`,
              `**Load unpacked** → select the unzipped folder.`,
              ``,
              `Changes: see [CHANGELOG.md](https://github.com/${repo}/blob/main/CHANGELOG.md).`
            ].join("\n");
            console.log(JSON.stringify({
              tag_name: `v${v}`,
              target_commitish: process.env.GITHUB_SHA,
              name: `Medicus Rota Manager v${v}`,
              body: notes,
              draft: false,
              prerelease: false
            }));
          ' "$VERSION")

          HTTP=$(curl -s -o resp.json -w '%{http_code}' -X POST \
            -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "$API/releases" -d "$BODY")
          if [ "$HTTP" != "201" ]; then
            echo "Response:" && cat resp.json
            echo "::error::Release creation failed with HTTP $HTTP"
            exit 1
          fi

          UPLOAD_URL=$(node -p "JSON.parse(require('fs').readFileSync('resp.json')).upload_url.replace(/\{.*\}$/, '')")
          HTTP=$(curl -s -o upload.json -w '%{http_code}' -X POST \
            -H "$AUTH" -H "Content-Type: application/zip" \
            "$UPLOAD_URL?name=medicus-rota-manager-v$VERSION.zip" \
            --data-binary "@medicus-rota-manager-v$VERSION.zip")
          if [ "$HTTP" != "201" ]; then
            echo "Response:" && cat upload.json
            echo "::error::Asset upload failed with HTTP $HTTP"
            exit 1
          fi
          echo "Released v$VERSION with zip attached."
