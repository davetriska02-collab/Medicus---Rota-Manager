name: Tests

# Runs the full automated test suite and syntax checks on every push and
# pull request, failing closed on any failure — releases are gated on this.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check all JS
        run: |
          fail=0
          for f in service-worker.js shared/*.js engine/*.js app/app.js app/views/*.js scripts/*.js; do
            node --check "$f" || { echo "::error::syntax error in $f"; fail=1; }
          done
          exit $fail

      - name: Verify manifest and package versions match
        run: |
          M=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")
          P=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          if [ "$M" != "$P" ]; then
            echo "::error::manifest.json ($M) and package.json ($P) versions differ"
            exit 1
          fi

      - name: Run automated test suite (fails closed)
        run: npm test
